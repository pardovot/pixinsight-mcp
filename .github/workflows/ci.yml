name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # Startup, tool schemas and error paths as a client sees them. Needs no PixInsight, since
      # invalid calls are rejected before they reach the bridge.
      - name: Flightcheck the server
        run: npx -y mcp-flightcheck@0.1.0 node build/index.js
